name: Build, Test and Push

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Keyed on the ref: a tag run outlives a push to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Pinned exact: this action publishes no floating major tag past v7.6.
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # `--locked` fails rather than re-resolving: CI must install what the
      # lock file pins, not what the constraints happen to allow today.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyrefly check

      - name: Test
        run: uv run pytest

  spa:
    name: SPA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spa

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Matches the image's build stage.
          node-version: 26
          cache: npm
          cache-dependency-path: spa/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The `dom` project runs `*.browser.test.tsx` under real Chromium. The
      # runner ships none, and `npm ci` is told not to fetch one.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint:check

      - name: Lint styles
        run: npm run lint:css:check

      - name: Check formatting
        run: npm run format:check

      # `tsc -b && vite build`: a type error fails the run.
      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:run

  build-and-push:
    name: Image
    # Nothing is published that the tests have not passed on.
    needs: [backend, spa]
    # A PR cannot push; the arm64 build would be discarded.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Needed for git describe

      - name: Get version
        id: version
        run: |
          VERSION=$(git describe --tags --always)
          # Remove 'v' prefix if present
          VERSION=${VERSION#v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      # Registers the binfmt handlers the arm64 stages run under. The SPA
      # stage is pinned to the build platform and is not emulated.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
