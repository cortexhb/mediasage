version: 2

updates:
  # `uv`, not `pip`: the manifests are pyproject.toml and uv.lock.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /spa
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per week for the dev toolchain, not fifteen.
      dev:
        dependency-type: development
    ignore:
      # typescript-eslint 8.68 still peers on `typescript <6.1.0`.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Node majors are pinned by `spa/.nvmrc` and the SPA job.
      - dependency-name: node
        update-types: [version-update:semver-major]
