# Copy to config.yaml. Only `llm` is required; the rest default.
# Fields, defaults and env names: backend/config/models.py
# Plex identity comes from the browser sign-in, never from here.

llm:
  # anthropic/openai/gemini take api_key; ollama/custom take endpoint_url.
  provider: "custom"
  endpoint_url: "http://localhost:11434/v1"
  # Required: a guessed window overflows the model.
  context_window: 32768
  model_analysis: ""
  model_generation: ""
  smart_generation: false
  api_key: ""

defaults:
  track_count: 25

langfuse: # all four blank means tracing off. docs/langfuse_tracing.md
  base_url: ""
  public_key: ""
  secret_key: ""
  environment: ""
