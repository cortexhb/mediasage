services:
  mediasage:
    image: ghcr.io/cortexhb/mediasage:latest
    build:
      context: .
#      dockerfile: docker/Dockerfile
    container_name: mediasage
    # Optional: Run as specific user for NAS/Synology (use your PUID:PGID)
    # user: "1000:1000"
    ports:
      - "5765:5765"
    env_file:
      - .env.langfuse
    environment:
      # Performance tuning
      - UVICORN_WORKERS=${UVICORN_WORKERS:-1}
      # Unset means the SQLite file in ./data. Uncomment for the service below.
#      - MEDIASAGE_DATABASE__URL=postgresql+psycopg://mediasage:mediasage@postgres:5432/mediasage
#      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-)
#      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-)
#      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL:-)
    volumes:
      # Persist library cache across restarts
      # Ensure directory is writable: either set 'user' above, or run:
      #   mkdir -p ./data && chmod 777 ./data
      - ./data:/app/data
    restart: unless-stopped
    # `docker compose watch` (Compose 2.22+) applies edits without a manual
    # rebuild. The image runs uvicorn without --reload, so a Python edit has
    # to restart the container to take effect.
    develop:
      watch:
        - action: sync+restart
          path: ./backend
          target: /app/backend
          ignore:
            - __pycache__/
        # A dependency change has to be resolved and installed again.
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./uv.lock
        - action: rebuild
          path: Dockerfile

  # Optional Postgres backend, off unless the profile is asked for:
  #   docker compose --profile postgres up
  # No `depends_on`: the app retries, and a profile cannot be depended on.
  postgres:
    profiles: ["postgres"]
    image: postgres:18-alpine
    container_name: mediasage-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-mediasage}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mediasage}
      - POSTGRES_DB=${POSTGRES_DB:-mediasage}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data:
